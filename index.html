<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warhammer 40k Custom List</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'Garamond', system-ui, sans-serif;
    }
    body {
      background: #0b0d0f;
      background-image: radial-gradient(circle at 20% 30%, #1a1e22 0%, #030405 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #cfc6b0;
      background: linear-gradient(145deg, #d9cfb8 0%, #b8ab92 100%);
      padding: 32px 28px;
      border-radius: 40px 12px 40px 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 2px #7b6e5a, 0 0 0 6px #3d3529;
      border: 1px solid #b8a68b;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1f1b14;
      text-shadow: 2px 2px 0 #a3927a;
      margin-bottom: 4px;
      font-family: 'Times New Roman', serif;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #3b3124;
      letter-spacing: 3px;
      margin-bottom: 24px;
      border-bottom: 2px solid #6a5b44;
      padding-bottom: 10px;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(48, 38, 28, 0.2);
      padding: 12px 18px;
      border-radius: 30px 6px 30px 6px;
      border: 1px solid #826f56;
      transition: 0.15s;
      text-align: left;
    }
    .menu-item:hover {
      background: rgba(48, 38, 28, 0.35);
      transform: translateX(3px);
    }
    .menu-item .icon {
      font-size: 1.6rem;
      min-width: 40px;
    }
    .menu-item .info {
      flex: 1;
    }
    .menu-item .info h2 {
      font-size: 0.95rem;
      color: #1f170e;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .menu-item .info p {
      font-size: 0.7rem;
      color: #4d3d2c;
      margin-top: 1px;
    }
    .menu-item .info p code {
      background: rgba(0,0,0,0.07);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
    }
    .menu-item .btn {
      background: #2f261b;
      border: none;
      color: #f0e2cc;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      border-bottom: 3px solid #6e4d28;
      cursor: pointer;
      transition: 0.08s linear;
      box-shadow: 0 2px 0 #0f0b08;
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
    }
    .menu-item .btn:hover {
      background: #4a3b2c;
    }
    .menu-item .btn:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }
    .menu-item .btn-pdf {
      background: #1f3d2e;
      border-bottom-color: #2a6b47;
    }
    .menu-item .btn-pdf:hover {
      background: #2a5a3e;
    }
    .menu-item .btn-list {
      background: #3d2f4a;
      border-bottom-color: #6a4a7a;
    }
    .menu-item .btn-list:hover {
      background: #55426b;
    }
    .file-info {
      background: rgba(0,0,0,0.05);
      border-radius: 12px;
      padding: 8px 14px;
      margin: 8px 0 2px;
      font-size: 0.65rem;
      color: #3b3124;
    }
    .file-info code {
      background: rgba(0,0,0,0.07);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.55rem;
      color: #4d3d2c;
      letter-spacing: 1.5px;
      border-top: 1px solid #7b6e5a;
      padding-top: 12px;
    }
    @media (max-width: 600px) {
      .container { padding: 20px 14px; }
      .menu-item { flex-wrap: wrap; gap: 10px; }
      .menu-item .btn { width: 100%; text-align: center; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Warhammer 40k<br>Custom List</h1>
  <div class="subtitle">УПРАВЛЕНИЕ ПЕРСОНАЖАМИ</div>

  <div class="menu">
    <!-- Лист персонажа -->
    <div class="menu-item">
      <div class="icon">📜</div>
      <div class="info">
        <h2>Лист персонажа</h2>
        <p>Открыть <code>list.html</code></p>
      </div>
      <a href="list.html" class="btn btn-list" target="_blank">Открыть</a>
    </div>

    <!-- Справочник (ссылка на Google Docs) -->
    <div class="menu-item">
      <div class="icon">📖</div>
      <div class="info">
        <h2>Справочник</h2>
        <p>Открыть в <code>Google Docs</code></p>
      </div>
      <a href="https://docs.google.com/document/d/1xRR8QmgXgFQgIsRDIdOYfboWbyFtWF3tDXE1YaOi5_A/edit?usp=drive_link" class="btn btn-pdf" target="_blank">Открыть</a>
    </div>
  </div>

  <!-- Информация о файлах -->
  <div class="file-info">
    <code>index.html</code> · <code>list.html</code>
    <span style="display:block; margin-top:2px; font-size:0.6rem; color:#5a4a38;">все файлы в одной папке</span>
  </div>

  <div class="footer">⚡ ИМПЕРАТОР ЗАЩИЩАЕТ ⚡</div>
</div>
</body>
</html>
